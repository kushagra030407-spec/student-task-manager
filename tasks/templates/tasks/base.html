{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Student Task Manager{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'tasks/style.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'tasks:dashboard' %}"><span class="brand-mark">✓</span> Student<span>Task</span></a>
    <nav><a href="{% url 'tasks:dashboard' %}">Dashboard</a><a href="/admin/">Admin</a></nav>
  </header>
  <main class="page-shell">
    {% if messages %}
      <div class="messages">
        {% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
    <footer>Built with Django · Keep learning, one task at a time.</footer>
  </main>
</body>
</html>
